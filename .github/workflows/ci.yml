name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r typecheck
      - run: pnpm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t gantt-planner:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name gp -p 3000:3000 -e COOKIE_SECRET=ci-secret -e PGLITE_DIR=/tmp/pglite gantt-planner:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          curl -sf localhost:3000/api/health
          curl -sf -o /dev/null localhost:3000/
          docker logs gp | tail -5
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browser
        working-directory: packages/web
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Start server with the built web app
        working-directory: packages/server
        run: |
          PORT=3000 PGLITE_DIR=/tmp/pglite WEB_DIST=$GITHUB_WORKSPACE/packages/web/dist COOKIE_SECRET=ci node dist/main.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
      - name: Run end-to-end smoke test
        working-directory: packages/web
        run: BASE_URL=http://localhost:3000 node e2e/smoke.cjs
      - if: failure()
        run: tail -50 /tmp/server.log
